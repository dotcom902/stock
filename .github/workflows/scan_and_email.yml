name: Daily Stock Scan & Email

on:
  schedule:
    # GitHub cron 常延遲 1–6 小時，所以在台北 09:00 前後多設備援。
    # 同一天只寄一封（用 cache 當寄信標記）。
    # 時區：Asia/Taipei = UTC+8。週日/週一美股無完整收盤，不跑。
    - cron: '0 1 * * 2-6'      # 台北 09:00 主目標
    - cron: '15 1 * * 2-6'     # 台北 09:15 備援
    - cron: '30 1 * * 2-6'     # 台北 09:30 備援
    - cron: '0 2 * * 2-6'      # 台北 10:00 備援
    - cron: '0 3 * * 2-6'      # 台北 11:00 備援（前幾檔被跳過時）
  workflow_dispatch:

jobs:
  scan-and-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      TZ: Asia/Taipei

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Taipei date
        run: echo "TAIPEI_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore today's send marker
        uses: actions/cache@v4
        id: mail_sent
        with:
          path: .mail-sent
          key: mail-sent-${{ env.TAIPEI_DATE }}

      - name: Skip if already sent today
        if: steps.mail_sent.outputs.cache-hit == 'true'
        run: echo "台北 ${TAIPEI_DATE} 已寄過，略過本次備援。"

      - name: Set up Python
        if: steps.mail_sent.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.mail_sent.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock scan and email
        if: steps.mail_sent.outputs.cache-hit != 'true'
        run: |
          python main.py
          echo "sent ${TAIPEI_DATE}" > .mail-sent
