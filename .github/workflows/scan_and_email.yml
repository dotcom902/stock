name: Daily Stock Scan & Email

on:
  schedule:
    - cron: '25 14 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-mail:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # ✨ 新增：讓程式能讀取你的 AI 金鑰
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml html5lib curl_cffi google-genai
          
      - name: Run stock scan and email
        run: python main.py #run
